; ParaVario - paramotor audio flight computer (Seeed XIAO ESP32C3)
;
; Firmware:     pio run -e release -t upload      (or -e debug for verbose trace logging)
; Voice clips:  python tools/make_voice.py         (generates data/v/*.adp)
;               pio run -e release -t uploadfs     (flashes the LittleFS image)
; Log output:   pio device monitor, or the "Logging" section of the web page
;
; One firmware: it finds out at start-up whether a GPS module is fitted (src/Hardware.h), so
;               the same build serves varios with and without one.
; Tests:        pio run -e test -t upload, then python tools/hil_test.py (docs/TESTING.md).
; Design:       README.md (the Architecture section)
;
; Over Wi-Fi:   release, debug and test upload over Wi-Fi (join the vario's Wi-Fi from
;               this PC first); release_usb and debug_usb upload over the USB cable.
;               pio run -e release -t upload       (firmware)
;               pio run -e release -t uploadfs     (voice clips; erases flight logs)
;               With a server network set in the vario's Wi-Fi settings the PC can stay on
;               that network: the uploader tries paravario.local, then 192.168.4.1.
;               The phone page (System > Firmware update) accepts the same .bin files from
;               .pio/build/<env>/firmware.bin and littlefs.bin. Uploads need the update
;               password (custom_ota_password below), also while flying.

[platformio]
default_envs = debug ;release

[common]
platform = espressif32
board = seeed_xiao_esp32c3
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
board_build.partitions = partitions.csv
board_build.filesystem = littlefs
extra_scripts = post:tools/pio_ota.py
custom_ota_password = otaPassword
build_flags =
    -I src
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCONFIG_BT_NIMBLE_MAX_CONNECTIONS=2
    -Wl,--wrap=esp_wifi_init   ; src/comms/WifiMemory.cpp caps the Wi-Fi packet buffers
lib_deps =
    adafruit/Adafruit DPS310@^1.1.1
    mikalhart/TinyGPSPlus@^1.1.0
    h2zero/NimBLE-Arduino@~1.4.3
    bblanchon/ArduinoJson@^7.2.0

[env:release]
extends = common
build_flags =
    ${common.build_flags}
    -DPV_DEBUG=0
    -DCORE_DEBUG_LEVEL=1
upload_protocol = custom
custom_ota_host = paravario.local  ; or the IP shown on the phone page (Wi-Fi section)

[env:debug]
extends = common
build_type = debug
build_flags =
    ${common.build_flags}
    -DPV_DEBUG=1
    -DCORE_DEBUG_LEVEL=3
upload_protocol = custom
custom_ota_host = paravario.local  ; or the IP shown on the phone page (Wi-Fi section)

; Same builds, uploaded over the USB cable instead of Wi-Fi.
[env:release_usb]
extends = common
build_flags =
    ${common.build_flags}
    -DPV_DEBUG=0
    -DCORE_DEBUG_LEVEL=1

[env:debug_usb]
extends = common
build_type = debug
build_flags =
    ${common.build_flags}
    -DPV_DEBUG=1
    -DCORE_DEBUG_LEVEL=3

; Debug build plus simulated sensors (src/test/Sim.*), driven by tools/hil_test.py over Wi-Fi.
; With the simulation off it behaves like the debug build.
[env:test]
extends = common
build_type = debug
build_flags =
    ${common.build_flags}
    -DPV_DEBUG=1
    -DPV_TEST=1
    -DCORE_DEBUG_LEVEL=3
upload_protocol = custom
custom_ota_host = paravario.local
