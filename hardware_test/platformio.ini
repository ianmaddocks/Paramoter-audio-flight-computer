; ParaVario hardware test (Seeed XIAO ESP32C3)
;
; Checks every peripheral and reports through a phone web page and USB serial.
;   Build & flash:  cd hardware_test && pio run -t upload
;   Web page:       join Wi-Fi "ParaVario-Test" (password: paramotor), open http://192.168.4.1
;   Serial:         pio device monitor
;
; Uses the main project's pin map (../src/Pins.h) and partition table, so flashing this test
; leaves the voice clips, settings and saved flight state of the main firmware intact.

[platformio]
; Voice clips (data/v/*.adp) come from the main project, so "pio run -t uploadfs" here flashes the same image
data_dir = ../Paramoter audio flight computer/data

[env:hwtest]
platform = espressif32
board = seeed_xiao_esp32c3
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
board_build.partitions = ../Paramoter audio flight computer/partitions.csv
board_build.filesystem = littlefs
build_flags =
    -I ../src
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=1
lib_deps =
    adafruit/Adafruit DPS310@^1.1.1
    mikalhart/TinyGPSPlus@^1.1.0
    h2zero/NimBLE-Arduino@~1.4.3
    bblanchon/ArduinoJson@^7.2.0
